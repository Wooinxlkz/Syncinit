[package]
name = "syncinit"
version = "0.1.9"
description = "Syncinit — a fast, modern archive manager (WinRAR alternative) built in Rust + Tauri"
edition = "2021"
authors = ["Ch. Abdelkrim"]

[lib]
name = "syncinit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# archive formats
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "time", "aes-crypto"] }
sevenz-rust = { version = "0.6", features = ["aes256"] }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zstd = { version = "0.13", features = ["zstdmt"] }
bzip2 = "0.4"
crc32fast = "1"

# perf + traversal
walkdir = "2"
rayon = "1"

# security / encryption (for our own encrypted archive format + password-protected zips)
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
zeroize = "1"

# misc
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Direct Win32 registry access for the context-menu registration — replaces
# shelling out to reg.exe (see lib.rs `register_context_menu`): spawning a
# process per registry value was both the console-flash bug and a real
# source of startup lag (40+ process spawns, each one more overhead for AV
# scanners to hook), since it ran on every launch.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
