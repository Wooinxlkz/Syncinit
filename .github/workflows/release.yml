name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves and validates the release version.
  prepare:
    name: Resolve release version
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve and validate version
        id: resolve
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RELEASE_TAG#v}"
          CONFIG_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          test "$VERSION" = "$CONFIG_VERSION" || {
            echo "Tag $RELEASE_TAG does not match app version $CONFIG_VERSION"
            exit 1
          }

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Builds Windows only, for now.
  build:
    name: Build (windows)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: bun install

      - name: Build installer
        run: bunx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Prepare release artifacts
        shell: bash
        run: |
          NSIS_DIR="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"

          mkdir -p release-artifacts

          SETUP="$(find "$NSIS_DIR" -maxdepth 1 -name '*-setup.exe' -print -quit)"

          test -n "$SETUP" || {
            echo "Windows installer was not found."
            exit 1
          }

          cp "$SETUP" "release-artifacts/Koink_${VERSION}_x64-setup.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koink-windows-${{ env.VERSION }}
          path: release-artifacts/
          if-no-files-found: error

  # Publishes the GitHub Release with the Windows installer attached.
  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: koink-windows-${{ env.VERSION }}
          path: release-artifacts

      - name: Publish to GitHub release
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Koink ${VERSION}"

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            release-artifacts/* \
            --clobber
